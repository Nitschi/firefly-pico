name: Build femto image (arm64 tarball)

# Builds the stripped-down "femto" Pico image for the Raspberry Pi (linux/arm64)
# on a native GitHub arm64 runner, then uploads it as a gzipped docker-save
# tarball artifact. No registry. Runs on every push to femto that touches the
# app/build, and can also be run manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [femto]
    paths:
      - 'front/**'
      - 'back/**'
      - 'Dockerfile'
      - '.github/workflows/femto-build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout femto source
        uses: actions/checkout@v4

      - name: Build arm64 image
        run: docker build --build-arg APP_VERSION=femto -t firefly-pico:femto -f Dockerfile .

      - name: Save and compress image
        run: docker save firefly-pico:femto | gzip > firefly-pico-femto.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefly-pico-femto
          path: firefly-pico-femto.tar.gz
          retention-days: 7
          if-no-files-found: error
