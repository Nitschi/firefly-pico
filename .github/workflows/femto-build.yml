name: Build femto image (arm64 tarball)

# Builds the stripped-down "femto" Pico image for the Raspberry Pi (linux/arm64)
# on a native GitHub arm64 runner, pushes it to ghcr.io/<owner>/firefly-pico:femto
# and also uploads it as a gzipped docker-save tarball artifact. Runs on every
# push to femto that touches the app/build, and can also be run manually from
# the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [femto]
    paths:
      - 'front/**'
      - 'back/**'
      - 'Dockerfile'
      - '.github/workflows/femto-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout femto source
        uses: actions/checkout@v4

      - name: Build arm64 image
        run: docker build --build-arg APP_VERSION=femto -t firefly-pico:femto -f Dockerfile .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to ghcr.io
        run: |
          image=ghcr.io/${{ github.repository_owner }}/firefly-pico:femto
          image=${image,,}
          docker tag firefly-pico:femto "$image"
          docker push "$image"

      - name: Save and compress image
        run: docker save firefly-pico:femto | gzip > firefly-pico-femto.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefly-pico-femto
          path: firefly-pico-femto.tar.gz
          retention-days: 7
          if-no-files-found: error
